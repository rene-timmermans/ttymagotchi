name: Go CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting, tests and analysis
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test -race ./...
          go vet ./...
          go build -tags artgallery -o bin/artgallery ./cmd/artgallery
          go build -race -o bin/ttymagotchi ./cmd/ttymagotchi
      - name: Terminal interaction and persistence
        run: |
          python3 scripts/smoke_test.py bin/ttymagotchi egg nl
          python3 scripts/smoke_test.py bin/ttymagotchi adult en
